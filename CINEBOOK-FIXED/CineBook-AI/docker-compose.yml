name: cinebook-ai
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cinebook}
      MYSQL_USER: ${MYSQL_USER:-cinebook}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cinebook_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_only_change_me}
    ports: ["3306:3306"]
    volumes: ["cinebook-mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["cinebook-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-cinebook}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cinebook_dev_only}
    ports: ["5672:5672", "15672:15672"]
    volumes: ["cinebook-rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cinebook}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-cinebook}
      DB_PASSWORD: ${MYSQL_PASSWORD:-cinebook_dev_only}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-secret-at-least-32-bytes-long-before-sharing}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-14}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_LOGIN_ALERTS: ${APP_MAIL_LOGIN_ALERTS:-true}
      APP_EMAIL_VERIFICATION_REQUIRED: ${APP_EMAIL_VERIFICATION_REQUIRED:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME:-noreply@cinebook.local}}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      API_DOCS_PUBLIC: ${API_DOCS_PUBLIC:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SEAT_HOLD_MINUTES: ${SEAT_HOLD_MINUTES:-5}
      APP_CACHE_TYPE: ${APP_CACHE_TYPE:-redis}
      APP_REDIS_ENABLED: ${APP_REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_MESSAGING_ENABLED: ${APP_MESSAGING_ENABLED:-true}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-cinebook}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cinebook_dev_only}
      PAYMENT_MODE: ${PAYMENT_MODE:-SIMULATOR}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 30
  frontend:
    build: ./frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["5173:80"]
volumes:
  cinebook-mysql:
  cinebook-redis:
  cinebook-rabbitmq:
